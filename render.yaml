# Blueprint di Render: crea il sito iVibe e un database Postgres gratuito.
# Su Render: New > Blueprint > scegli la repository "ivibe" > Apply.
services:
  - type: web
    name: ivibe
    runtime: node
    plan: free
    rootDir: web
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ivibe-db
          property: connectionString

databases:
  - name: ivibe-db
    plan: free
    databaseName: ivibe
    user: ivibe
    ipAllowList: [] # raggiungibile solo dai servizi Render, non da internet
